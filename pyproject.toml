[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doodle-assets"
version = "0.1.0"
description = "Extract named hand-drawn icons from PNG sheets"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.1"]

[tool.setuptools.packages.find]
where = ["src"]
